<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#0b3d4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c4ff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- faint decorative code brackets -->
  <text x="60" y="220" font-family="Consolas, Menlo, monospace" font-size="180" fill="#ffffff" opacity="0.05" font-weight="700">&lt;/&gt;</text>
  <text x="960" y="220" font-family="Consolas, Menlo, monospace" font-size="180" fill="#ffffff" opacity="0.05" font-weight="700">{ }</text>

  <!-- top accent line -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- name -->
  <text x="600" y="150" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="60" font-weight="700" fill="#ffffff" text-anchor="middle">
    VISHVAK SUNKARI
  </text>

  <!-- role subtitle -->
  <text x="600" y="200" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="26" font-weight="500" fill="#7dd3fc" text-anchor="middle">
    Backend Developer  •  Data Analyst  •  AI Enthusiast
  </text>

  <!-- underline accent -->
  <rect x="450" y="220" width="300" height="4" rx="2" fill="url(#accent)"/>
</svg>
